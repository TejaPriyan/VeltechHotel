<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings — VELTECH Hotel</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .profile-page { padding: 110px 40px 60px; max-width: 1100px; margin: 0 auto; }
    .profile-header { display: flex; align-items: center; gap: 24px; margin-bottom: 48px; padding: 32px; background: var(--dark-3); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); }
    .profile-avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 700; color: var(--dark); flex-shrink: 0; }
    .profile-info h2 { font-size: 1.5rem; color: var(--white); margin-bottom: 4px; }
    .profile-info p { color: var(--text-muted); font-size: 0.9rem; }
    .profile-stats { margin-left: auto; display: flex; gap: 32px; text-align: center; }
    .profile-stat-num { font-size: 1.6rem; color: var(--gold); font-weight: 700; font-family: 'Playfair Display', serif; }
    .profile-stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

    .bookings-section h3 { font-size: 1.3rem; color: var(--white); margin-bottom: 24px; }
    .booking-card { background: var(--dark-3); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 16px; display: grid; grid-template-columns: 100px 1fr auto; gap: 20px; align-items: center; transition: var(--transition); }
    .booking-card:hover { border-color: var(--gold-dark); }
    .booking-card-img { width: 100px; height: 80px; object-fit: cover; border-radius: var(--radius); }
    .booking-card-title { font-size: 1rem; color: var(--white); margin-bottom: 6px; }
    .booking-card-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 8px; }
    .booking-card-meta span { display: flex; align-items: center; gap: 4px; }
    .booking-card-amount { font-size: 1rem; color: var(--gold); font-weight: 600; }
    .booking-card-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }

    @media (max-width: 768px) {
      .profile-page { padding: 100px 20px 40px; }
      .profile-header { flex-direction: column; text-align: center; }
      .profile-stats { margin-left: 0; }
      .booking-card { grid-template-columns: 1fr; }
      .booking-card-img { width: 100%; height: 160px; }
      .booking-card-actions { align-items: flex-start; flex-direction: row; }
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="profile-page">
    <div class="profile-header">
      <div class="profile-avatar" id="profileAvatar">?</div>
      <div class="profile-info">
        <h2 id="profileName">Loading...</h2>
        <p id="profileEmail">—</p>
        <p style="margin-top:4px; font-size:0.8rem; color:var(--gold);">Member since <span id="memberSince">—</span></p>
      </div>
      <div class="profile-stats">
        <div><div class="profile-stat-num" id="totalBookings">0</div><div class="profile-stat-label">Bookings</div></div>
        <div><div class="profile-stat-num" id="totalSpent">₹0</div><div class="profile-stat-label">Total Spent</div></div>
      </div>
    </div>

    <div class="bookings-section">
      <h3>My Reservations</h3>
      <div id="bookingsList">
        <div class="empty-state"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="/js/utils.js"></script>
  <script>
    document.getElementById('navbar-placeholder').innerHTML = navbarHTML();
    document.getElementById('footer-placeholder').innerHTML = footerHTML();
    setupNavbar();

    if (!requireAuth()) {}

    const user = getUser();
    if (user) {
      document.getElementById('profileAvatar').textContent = user.name.charAt(0).toUpperCase();
      document.getElementById('profileName').textContent = user.name;
      document.getElementById('profileEmail').textContent = user.email;
    }

    async function loadBookings() {
      try {
        const bookings = await apiFetch('/bookings/my');
        const list = document.getElementById('bookingsList');

        document.getElementById('totalBookings').textContent = bookings.length;
        const spent = bookings.filter(b => b.bookingStatus !== 'cancelled').reduce((s, b) => s + b.totalAmount, 0);
        document.getElementById('totalSpent').textContent = formatCurrency(spent);

        if (!bookings.length) {
          list.innerHTML = `<div class="empty-state"><div class="empty-icon">🏨</div><h3>No bookings yet</h3><p>Start your luxury journey today</p><a href="/rooms" class="btn btn-primary" style="margin-top:20px;">Explore Rooms</a></div>`;
          return;
        }

        list.innerHTML = bookings.map(b => `
          <div class="booking-card">
            <img src="${b.roomId?.image || '/hotel1.png'}" alt="${b.roomId?.title}" class="booking-card-img">
            <div>
              <div class="booking-card-title">${b.roomId?.title || 'Room'}</div>
              <div class="booking-card-meta">
                <span>📅 ${formatDate(b.checkInDate)} → ${formatDate(b.checkOutDate)}</span>
                <span>👥 ${b.guests} guest${b.guests > 1 ? 's' : ''}</span>
                <span>🪪 ${b.idProofType}</span>
              </div>
              <div class="booking-card-amount">${formatCurrency(b.totalAmount)}</div>
            </div>
            <div class="booking-card-actions">
              <span class="badge badge-${b.bookingStatus}">${b.bookingStatus}</span>
              ${b.bookingStatus === 'pending' ? `<button class="btn btn-danger btn-sm" onclick="cancelBooking('${b._id}')">Cancel</button>` : ''}
            </div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('bookingsList').innerHTML = '<div class="empty-state"><p>Failed to load bookings</p></div>';
      }
    }

    async function cancelBooking(id) {
      if (!confirm('Are you sure you want to cancel this booking?')) return;
      try {
        await apiFetch(`/bookings/${id}/cancel`, { method: 'PUT' });
        showToast('Booking cancelled', 'info');
        loadBookings();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    loadBookings();
  </script>
</body>
</html>
