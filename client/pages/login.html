<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — VELTECH Hotel</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body {
      background: url('/hotel6.jpeg') center/cover no-repeat fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .auth-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 0;
    }
    .auth-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 20px 40px;
      position: relative;
      z-index: 1;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: rgba(17,17,17,0.92);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 44px 40px;
      backdrop-filter: blur(20px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-logo .brand { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--gold); letter-spacing: 2px; }
    .auth-logo .sub { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 3px; text-transform: uppercase; }
    .auth-title { font-size: 1.6rem; color: var(--white); margin-bottom: 6px; }
    .auth-subtitle { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 28px; }
    .auth-divider { text-align: center; color: var(--text-muted); font-size: 0.82rem; margin: 20px 0; position: relative; }
    .auth-divider::before, .auth-divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: var(--glass-border); }
    .auth-divider::before { left: 0; }
    .auth-divider::after { right: 0; }
    .auth-footer { text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-muted); }
    .auth-footer a { color: var(--gold); font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }
    .error-msg { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; padding: 12px 16px; border-radius: var(--radius); font-size: 0.88rem; margin-bottom: 16px; display: none; }
    .btn-full { width: 100%; justify-content: center; }
    .input-icon-wrap { position: relative; }
    .input-icon-wrap input { padding-right: 44px; }
    .toggle-pw { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); font-size: 1rem; background: none; border: none; }
  </style>
</head>
<body>
  <div class="auth-overlay"></div>
  <nav class="navbar" style="z-index:10;">
    <a href="/" class="nav-brand">
      <div><span class="brand-name">VELTECH</span><span class="brand-sub">Hotel & Suites</span></div>
    </a>
    <ul class="nav-links" id="nav-links"></ul>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="brand">VELTECH</div>
        <div class="sub">Hotel & Suites</div>
      </div>
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Sign in to your account to continue</p>

      <div class="error-msg" id="errorMsg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-icon-wrap">
            <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="toggle-pw" onclick="togglePw()">👁</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="submitBtn">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/signup">Create one</a>
      </div>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script>
    // Setup minimal nav
    document.getElementById('nav-links').innerHTML = `
      <li><a href="/">Home</a></li>
      <li><a href="/rooms">Rooms</a></li>
      <li><a href="/signup" class="btn-nav">Sign Up</a></li>
    `;

    // Redirect if already logged in
    if (isLoggedIn()) window.location.href = '/';

    function togglePw() {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errMsg = document.getElementById('errorMsg');
      errMsg.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btn.innerHTML = '<span class="spinner"></span> Signing in...';
      btn.disabled = true;

      try {
        const data = await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        setAuth(data.token, data.user);
        showToast(`Welcome back, ${data.user.name}!`, 'success');
        setTimeout(() => {
          window.location.href = data.user.role === 'admin' ? '/admin' : '/';
        }, 800);
      } catch (err) {
        errMsg.textContent = err.message;
        errMsg.style.display = 'block';
        btn.innerHTML = 'Sign In';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
