<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | VELTECH Hotel</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: url('hotel7.jpeg') no-repeat center center/cover;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1;
    }

    .welcome-container {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.1);
      padding: 40px 30px;
      border-radius: 15px;
      max-width: 500px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(8px);
    }

    h1 {
      font-size: 2.2em;
      color: #00ffee;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.1em;
      margin-bottom: 30px;
    }

    a.button {
      display: inline-block;
      padding: 12px 25px;
      background-color: #00ffd9;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      transition: 0.3s;
    }

    a.button:hover {
      background-color: #fff;
      color: #000;
    }

    @media (max-width: 600px) {
      .welcome-container { width: 90%; padding: 30px; }
      h1 { font-size: 1.8em; }
    }
  </style>

  <!-- TP Brand Favicons -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <div class="overlay"></div>

  <div class="welcome-container">
    <h1>Welcome to VELTECH Hotel!</h1>
    <p>Your account has been created successfully.<br>Enjoy browsing our luxurious rooms and services.</p>
    <a href="index.html" class="button">Go to Home</a>
  </div>
</body>
</html>
